name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: No setState
        run: |
          if grep -rn "setState(" lib/; then
            echo "setState is banned: use a Cubit or Bloc" >&2
            exit 1
          fi
      - name: Test
        run: flutter test --coverage
