name: Pages

on:
  push:
    branches: [main]
    paths:
      - docs/resources/MOCK.html
      - docs/resources/DESIGN_SYSTEM.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir site
          cp docs/resources/MOCK.html site/mock.html
          cp docs/resources/DESIGN_SYSTEM.html site/design-system.html
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Veloce</title>
          <ul>
            <li><a href="mock.html">Mock</a></li>
            <li><a href="design-system.html">Design system</a></li>
          </ul>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
